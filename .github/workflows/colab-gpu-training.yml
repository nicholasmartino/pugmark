name: "Execute Training on Colab GPU with custom script"

on:
  workflow_dispatch:  # Allow manual trigger
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '50'
        type: string
  push:
    branches:
      - master
    paths:
      - "notebooks/train_footprints.ipynb"
      - "src/training/**"
      - ".github/workflows/colab-gpu-training.yml"

jobs:
  run-on-colab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          access_token_lifetime: 3600s
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform,
            https://www.googleapis.com/auth/drive,
            https://www.googleapis.com/auth/drive.file,
            https://www.googleapis.com/auth/drive.scripts
          create_credentials_file: true
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Only install packages needed for the Colab execution script
          # (The notebook will run on Colab's servers with their own dependencies)
          pip install nbformat google-auth google-auth-oauthlib google-api-python-client
      
      - name: Create output directory
        run: mkdir -p notebooks/output
        
      - name: Set script permissions
        run: |
          chmod +x run_colab.py
          chmod +x colab_cells.py
      
      - name: Execute notebook on Colab GPU
        run: |
          # Create timestamp for unique filename
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_PATH="notebooks/output/train_footprints_${TIMESTAMP}.ipynb"
          
          echo "Executing training notebook with ${{ github.event.inputs.epochs || '50' }} epochs on Colab GPU..."
          
          # Set the access token in environment
          export GCP_ACCESS_TOKEN="${{ steps.auth.outputs.access_token }}"
          export PYTHONUNBUFFERED=1  # Force Python to flush output immediately
          
          # Add debug prints to check environment
          echo "Current directory: $(pwd)"
          echo "Python version: $(python --version)"
          echo "Script exists: $(ls -la run_colab.py)"
          echo "Helper script exists: $(ls -la colab_cells.py)"
          
          # Execute the notebook using our custom script with error trapping
          set -x  # Print commands before execution
          python -u run_colab.py notebooks/train_footprints.ipynb \
            --params "EPOCHS=${{ github.event.inputs.epochs || '50' }}" \
            --machine-type "GPU" \
            --output "$OUTPUT_PATH" \
            --no-browser || { echo "Script execution failed with code $?"; cat /tmp/colab_error.log 2>/dev/null; exit 1; }
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and set these as needed:
          SHARE_WITH_EMAIL: ${{ secrets.USER_EMAIL }}  # Your Google account email for sharing
          SHARED_DRIVE_ID: ${{ secrets.SHARED_DRIVE_ID }}  # ID of your shared drive
      
      - name: Upload notebook output
        uses: actions/upload-artifact@v4
        with:
          name: colab-results
          path: notebooks/output/
          retention-days: 7 