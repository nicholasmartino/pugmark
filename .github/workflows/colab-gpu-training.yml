name: "Execute Training on Colab GPU with custom script"

on:
  workflow_dispatch:  # Allow manual trigger
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '50'
        type: string
  push:
    branches:
      - master
    paths:
      - "notebooks/train_footprints.ipynb"
      - "src/training/**"
      - ".github/workflows/colab-gpu-training.yml"

jobs:
  run-on-colab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          access_token_lifetime: 3600s
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform,
            https://www.googleapis.com/auth/drive,
            https://www.googleapis.com/auth/drive.file,
            https://www.googleapis.com/auth/drive.scripts
          create_credentials_file: true
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Now install project dependencies
          pip install -r requirements.txt
          
          # Install required packages for our Colab execution script
          pip install nbformat google-auth google-auth-oauthlib google-api-python-client
      
      - name: Create output directory
        run: mkdir -p notebooks/output
        
      - name: Set script permissions
        run: chmod +x run_colab.py
      
      - name: Execute notebook on Colab GPU
        run: |
          # Create timestamp for unique filename
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_PATH="notebooks/output/train_footprints_${TIMESTAMP}.ipynb"
          
          echo "Executing training notebook with ${{ github.event.inputs.epochs || '50' }} epochs on Colab GPU..."
          
          # Set the access token in environment
          export GCP_ACCESS_TOKEN="${{ steps.auth.outputs.access_token }}"
          
          # Execute the notebook using our custom script
          python run_colab.py notebooks/train_footprints.ipynb \
            --params "EPOCHS=${{ github.event.inputs.epochs || '50' }}" \
            --machine-type "GPU" \
            --output "$OUTPUT_PATH" \
            --no-browser
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload notebook output
        uses: actions/upload-artifact@v4
        with:
          name: colab-results
          path: notebooks/output/
          retention-days: 7 