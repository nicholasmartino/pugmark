name: "Execute Training on Colab GPU with colab-cli"

on:
  workflow_dispatch:  # Allow manual trigger
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '50'
        type: string
  push:
    branches:
      - master
    paths:
      - "notebooks/train_footprints.ipynb"
      - "src/training/**"
      - ".github/workflows/colab-gpu-training.yml"

jobs:
  run-on-colab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          access_token_lifetime: 3600s
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform,
            https://www.googleapis.com/auth/drive,
            https://www.googleapis.com/auth/drive.file
          create_credentials_file: true
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Complete uninstall of any previous versions
          pip uninstall -y click typer colab-cli
          
          # Create requirements file with exact dependency versions
          cat > colab_deps.txt << EOF
          click==7.1.2
          typer==0.3.2
          colab-cli==2.2.5
          EOF
          
          # Install packages in specific order with --no-deps to prevent automatic dependency resolution
          pip install --no-deps click==7.1.2
          pip install --no-deps typer==0.3.2
          pip install --no-deps colab-cli==2.2.5
          
          # Now install other dependencies
          pip install gcsfs tensorflow gitpython
          pip install -r requirements.txt  # Install project dependencies
          pip install --upgrade google-auth google-auth-oauthlib google-auth-httplib2
          
          # Try importing colab-cli to verify it works
          python -c "from colab_cli.main import app; print('colab-cli import successful')"
          
          # Debugging information
          echo "Checking installed packages:"
          pip list | grep -E 'click|typer|colab-cli'
      
      - name: Create output directory
        run: mkdir -p notebooks/output
      
      - name: Configure colab-cli authentication
        run: |
          mkdir -p ~/.config/colab_cli
          echo "{\"token\": \"$GCP_ACCESS_TOKEN\"}" > ~/.config/colab_cli/config.json
          echo "colab-cli configuration created"
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      
      - name: Execute notebook on Colab GPU
        run: |
          # Create timestamp for unique filename
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          OUTPUT_PATH="notebooks/output/train_footprints_${TIMESTAMP}.ipynb"
          
          echo "Executing training notebook with ${{ github.event.inputs.epochs || '50' }} epochs on Colab GPU..."
          
          # Execute the notebook using colab-cli
          colab-cli run notebooks/train_footprints.ipynb \
            --params "EPOCHS=${{ github.event.inputs.epochs || '50' }}" \
            --machine-type "GPU" \
            --output "$OUTPUT_PATH" \
            --no-browser
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload notebook output
        uses: actions/upload-artifact@v4
        with:
          name: colab-results
          path: notebooks/output/
          retention-days: 7 