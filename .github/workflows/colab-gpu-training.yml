name: "Execute Training on Colab GPU"

on:
  workflow_dispatch:  # Allow manual trigger
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '50'
        type: string
  push:
    branches:
      - master
    paths:
      - "notebooks/train_footprints.ipynb"
      - "src/training/**"

jobs:
  run-on-colab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          access_token_lifetime: 3600s
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform,
            https://www.googleapis.com/auth/drive,
            https://www.googleapis.com/auth/drive.file
          create_credentials_file: true
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install colab-cli gcsfs tensorflow gitpython
      
      - name: Create output directory
        run: mkdir -p notebooks/output
      
      - name: Execute notebook on Colab GPU
        run: |
          echo "Executing training notebook with ${{ github.event.inputs.epochs || '50' }} epochs on Colab GPU..."
          
          # Convert GCP credentials to format needed by colab-cli
          python -c "
          import json, os
          creds_path = os.environ['GOOGLE_APPLICATION_CREDENTIALS']
          with open(creds_path, 'r') as f:
              creds = json.load(f)
          # Save in format expected by colab-cli
          with open('colab_creds.json', 'w') as f:
              json.dump(creds, f)
          "
          
          # Run the notebook with GPU acceleration
          colab-cli auth login --credentials colab_creds.json
          
          # Clone repo to Colab and run notebook with parameters
          colab-cli notebook run notebooks/train_footprints.ipynb \
            --param EPOCHS=${{ github.event.inputs.epochs || '50' }} \
            --runtime gpu \
            --output notebooks/output/train_footprints_$(date +%Y%m%d_%H%M%S).ipynb
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload notebook output
        uses: actions/upload-artifact@v4
        with:
          name: colab-results
          path: notebooks/output/
          retention-days: 7 