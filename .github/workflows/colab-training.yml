name: "Execute Colab Notebook Training"

on:
  workflow_dispatch:  # Allow manual trigger
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '50'
        type: string
  push:
    branches:
      - master
    paths:
      - "notebooks/train_footprints.ipynb"
      - "src/training/**"

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter papermill gcsfs  # Additional requirements for notebook execution

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          access_token_lifetime: 3600s
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/devstorage.read_write
          create_credentials_file: true

      - name: Create output directory
        run: mkdir -p notebooks/output

      - name: Execute Notebook
        run: |
          echo "Executing training notebook with ${{ github.event.inputs.epochs || '50' }} epochs..."
          papermill notebooks/train_footprints.ipynb notebooks/output/train_footprints_$(date +%Y%m%d_%H%M%S).ipynb -k python3 -p EPOCHS ${{ github.event.inputs.epochs || '50' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_ACTIONS: "true"
          
      - name: Upload notebook output
        uses: actions/upload-artifact@v4
        with:
          name: notebook-output
          path: notebooks/output/
          retention-days: 7 