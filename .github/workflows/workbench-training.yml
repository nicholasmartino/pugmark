name: "Vertex AI Workbench Training"

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/training/**'
      - 'scripts/vertex_workbench_execute.py'
      - 'scripts/run_on_workbench.sh'
      - '.github/workflows/workbench-training.yml'
  workflow_dispatch:
    inputs:
      instance_name:
        description: 'Vertex AI Workbench instance name'
        required: true
        type: string
      create_instance:
        description: 'Create a new instance if it does not exist'
        required: false
        default: true
        type: boolean
      machine_type:
        description: 'Machine type for the instance'
        required: false
        default: 'n1-standard-8'
        type: choice
        options:
          - 'n1-standard-4'
          - 'n1-standard-8'
          - 'n1-standard-16'
          - 'n1-highmem-8'
          - 'n1-highmem-16'
      accelerator_type:
        description: 'GPU accelerator type'
        required: false
        default: 'NVIDIA_TESLA_T4'
        type: choice
        options:
          - 'NVIDIA_TESLA_T4'
          - 'NVIDIA_TESLA_V100'
          - 'NVIDIA_TESLA_P100'
          - 'NVIDIA_TESLA_P4'
      accelerator_count:
        description: 'Number of GPUs'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '8'
      delete_after_training:
        description: 'Delete the instance after training completes (only if created by this workflow)'
        required: false
        default: false
        type: boolean
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '100'
        type: string
      batch_size:
        description: 'Training batch size'
        required: false
        default: '1'
        type: string

env:
  REGION: "us-central1"
  ZONE: "us-central1-a"
  SERVICE_ACCOUNT: "github-service-account"
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  TIMEOUT: "3600s"

jobs:
  run-workbench-training:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      # Configure Workload Identity Federation and generate an access token
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2.1.0"
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          access_token_lifetime: ${{ env.TIMEOUT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: "access_token"
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform

      # Set up Google Cloud SDK
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Install Python
      - name: "Set up Python"
        uses: "actions/setup-python@v4"
        with:
          python-version: "3.10"

      # Make scripts executable
      - name: "Make scripts executable"
        run: |
          chmod +x ./scripts/run_on_workbench.sh
          chmod +x ./scripts/vertex_workbench_execute.py

      # Submit training job to Vertex AI Workbench
      - name: "Run training on Vertex AI Workbench"
        run: ./scripts/run_on_workbench.sh
        env:
          GCP_PROJECT_ID: ${{ env.PROJECT_ID }}
          REGION: ${{ env.REGION }}
          ZONE: ${{ env.ZONE }}
          WORKBENCH_INSTANCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.instance_name || format('pugmark-{0}', github.run_id) }}
          CREATE_INSTANCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_instance || 'true' }}
          MACHINE_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.machine_type || 'n1-standard-8' }}
          ACCELERATOR_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.accelerator_type || 'NVIDIA_TESLA_T4' }}
          ACCELERATOR_COUNT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.accelerator_count || '1' }}
          DELETE_AFTER_TRAINING: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delete_after_training || 'true' }}
          EPOCHS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.epochs || '100' }}
          BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.batch_size || '1' }} 