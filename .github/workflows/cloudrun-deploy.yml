name: "Deploy to Cloud Run"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: latest)"
        required: false
        default: "latest"

env:
  REGION: "us-central1"
  SERVICE_NAME: "pugmark-service"
  REPOSITORY: "pugmark"

jobs:
  deploy:
    runs-on: "ubuntu-latest"
    environment: production

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2.1.0"
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          access_token_lifetime: 3600s
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: "Deploy to Cloud Run"
        run: |-
          gcloud run deploy $SERVICE_NAME \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/pugmark:${{ inputs.image_tag }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_PROJECT_ID }}
