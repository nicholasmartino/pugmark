compute:
  instance_type: t4-medium # or "gpu-a100" for faster training
  region: us-east-1

environment:
  huggingface_hub_token: ${HUGGINGFACE_TOKEN}
  env_vars:
    DATASET_PATH: "/path/to/dataset" # Update this
    EPOCHS: "10"
    BATCH_SIZE: "1"

training:
  command: python train.py
  repository: your-username/your-model-name
  package:
    - train.py
    - pix2pix.py
    - requirements.txt
